<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800">
  <title>ADVIS v0.5 Compact Module - Exploded View (Conceptual)</title>
  <desc>Conceptual visualization only - not production layout, not mechanical CAD release.</desc>

  <!-- Background -->
  <rect width="700" height="800" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">ADVIS v0.5 Compact Module - Exploded View</text>
  <text x="350" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Conceptual visualization only - not production layout, not mechanical CAD release</text>

  <!-- Vertical assembly axis (dashed line) -->
  <line x1="350" y1="70" x2="350" y2="750" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Layer 1: Housing Front Shell (top) -->
  <g id="front-shell" transform="translate(0,0)">
    <polygon points="200,100 350,130 500,100 350,70" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
    <polygon points="200,100 200,120 350,150 350,130" fill="#d8d8d8" stroke="#999" stroke-width="1"/>
    <polygon points="350,130 350,150 500,120 500,100" fill="#c8c8c8" stroke="#999" stroke-width="1"/>
    <!-- Camera window cutouts -->
    <ellipse cx="300" cy="105" rx="20" ry="8" fill="#b0d8f0" stroke="#6090b0" stroke-width="1"/>
    <ellipse cx="420" cy="100" rx="15" ry="6" fill="#b0d8f0" stroke="#6090b0" stroke-width="1"/>
    <text x="550" y="108" font-family="Arial, sans-serif" font-size="10" fill="#555">Housing Front Shell</text>
    <text x="550" y="120" font-family="Arial, sans-serif" font-size="8" fill="#888">(plastic, with camera windows)</text>
    <line x1="505" y1="105" x2="545" y2="108" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- Layer 2: Windshield Bracket -->
  <g id="windshield-bracket" transform="translate(0,70)">
    <polygon points="250,130 350,150 450,130 350,110" fill="#f0e8d0" stroke="#c0a060" stroke-width="1.5"/>
    <polygon points="250,130 250,140 350,160 350,150" fill="#e8dcc0" stroke="#c0a060" stroke-width="1"/>
    <polygon points="350,150 350,160 450,140 450,130" fill="#e0d0b0" stroke="#c0a060" stroke-width="1"/>
    <!-- Mounting tab -->
    <rect x="330" y="120" width="40" height="6" rx="2" fill="#d8c8a0" stroke="#c0a060" stroke-width="0.5"/>
    <text x="550" y="135" font-family="Arial, sans-serif" font-size="10" fill="#555">Windshield Bracket</text>
    <text x="550" y="147" font-family="Arial, sans-serif" font-size="8" fill="#888">(adhesive mount to glass)</text>
    <line x1="455" y1="133" x2="545" y2="135" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- Layer 3: Forward Camera Window (optical element) -->
  <g id="fwd-camera-window" transform="translate(0,150)">
    <polygon points="260,160 330,175 400,160 330,145" fill="#d0e8f8" stroke="#80b0d0" stroke-width="1.5" opacity="0.8"/>
    <polygon points="260,160 260,166 330,181 330,175" fill="#c0dcf0" stroke="#80b0d0" stroke-width="1"/>
    <polygon points="330,175 330,181 400,166 400,160" fill="#b0d0e8" stroke="#80b0d0" stroke-width="1"/>
    <text x="550" y="163" font-family="Arial, sans-serif" font-size="10" fill="#555">Forward Camera Window</text>
    <text x="550" y="175" font-family="Arial, sans-serif" font-size="8" fill="#888">(optical glass + IR-cut filter)</text>
    <line x1="405" y1="160" x2="545" y2="163" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- Layer 4: DMS Camera Window (optical element) -->
  <g id="dms-camera-window" transform="translate(0,210)">
    <polygon points="320,190 380,202 440,190 380,178" fill="#d0f8d8" stroke="#60b070" stroke-width="1.5" opacity="0.8"/>
    <polygon points="320,190 320,196 380,208 380,202" fill="#c0f0c8" stroke="#60b070" stroke-width="1"/>
    <polygon points="380,202 380,208 440,196 440,190" fill="#b0e8b8" stroke="#60b070" stroke-width="1"/>
    <text x="550" y="193" font-family="Arial, sans-serif" font-size="10" fill="#555">DMS Camera Window</text>
    <text x="550" y="205" font-family="Arial, sans-serif" font-size="8" fill="#888">(NIR-pass filter, 940nm)</text>
    <line x1="445" y1="190" x2="545" y2="193" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- Layer 5: Main PCB Assembly -->
  <g id="main-pcb" transform="translate(0,290)">
    <polygon points="200,240 350,270 500,240 350,210" fill="#2d7a3a" stroke="#1a5c28" stroke-width="2"/>
    <polygon points="200,240 200,252 350,282 350,270" fill="#246b30" stroke="#1a5c28" stroke-width="1"/>
    <polygon points="350,270 350,282 500,252 500,240" fill="#1f5d2a" stroke="#1a5c28" stroke-width="1"/>
    <!-- Component representations on PCB -->
    <rect x="320" y="228" width="30" height="15" rx="1" fill="#333" stroke="#111" stroke-width="0.5" transform="skewX(-10)"/>
    <text x="340" y="238" font-family="Arial, sans-serif" font-size="6" fill="#eee" transform="skewX(-10)">SoC</text>
    <rect x="370" y="232" width="18" height="10" rx="1" fill="#222" stroke="#111" stroke-width="0.5" transform="skewX(-10)"/>
    <text x="375" y="239" font-family="Arial, sans-serif" font-size="5" fill="#ccc" transform="skewX(-10)">DDR</text>
    <rect x="280" y="235" width="15" height="10" rx="1" fill="#222" stroke="#111" stroke-width="0.5" transform="skewX(-10)"/>
    <!-- Camera sensor chips -->
    <rect x="240" y="230" width="12" height="12" rx="1" fill="#4a4" stroke="#282" stroke-width="0.5"/>
    <rect x="420" y="236" width="10" height="10" rx="1" fill="#4a4" stroke="#282" stroke-width="0.5"/>
    <text x="550" y="238" font-family="Arial, sans-serif" font-size="10" fill="#555">Main PCB Assembly</text>
    <text x="550" y="250" font-family="Arial, sans-serif" font-size="8" fill="#888">(SoC + DDR + eMMC + sensors</text>
    <text x="550" y="262" font-family="Arial, sans-serif" font-size="8" fill="#888"> + CAN PHY + power + IR LEDs)</text>
    <line x1="505" y1="240" x2="545" y2="240" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- Layer 6: DMS Flex Cable -->
  <g id="dms-flex-cable" transform="translate(0,370)">
    <path d="M300,300 C320,310 380,310 420,295" fill="none" stroke="#f0a040" stroke-width="4"/>
    <path d="M300,304 C320,314 380,314 420,299" fill="none" stroke="#e89030" stroke-width="4"/>
    <!-- Connector ends -->
    <rect x="290" y="297" width="14" height="8" rx="1" fill="#f8d090" stroke="#c08020" stroke-width="0.5"/>
    <rect x="416" y="292" width="14" height="8" rx="1" fill="#f8d090" stroke="#c08020" stroke-width="0.5"/>
    <text x="550" y="303" font-family="Arial, sans-serif" font-size="10" fill="#555">DMS Flex Cable</text>
    <text x="550" y="315" font-family="Arial, sans-serif" font-size="8" fill="#888">(~50mm rigid-flex, MIPI + I2C)</text>
    <line x1="425" y1="298" x2="545" y2="303" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- Layer 7: Aluminum Rear Thermal Plate -->
  <g id="rear-plate" transform="translate(0,430)">
    <polygon points="180,360 350,395 520,360 350,325" fill="#c0c0c0" stroke="#888" stroke-width="2"/>
    <polygon points="180,360 180,375 350,410 350,395" fill="#a8a8a8" stroke="#888" stroke-width="1"/>
    <polygon points="350,395 350,410 520,375 520,360" fill="#989898" stroke="#888" stroke-width="1"/>
    <!-- Surface texture lines -->
    <line x1="250" y1="355" x2="350" y2="370" stroke="#b0b0b0" stroke-width="0.5"/>
    <line x1="300" y1="348" x2="400" y2="365" stroke="#b0b0b0" stroke-width="0.5"/>
    <line x1="350" y1="342" x2="450" y2="358" stroke="#b0b0b0" stroke-width="0.5"/>
    <text x="550" y="363" font-family="Arial, sans-serif" font-size="10" fill="#555">Aluminum Rear Thermal Plate</text>
    <text x="550" y="375" font-family="Arial, sans-serif" font-size="8" fill="#888">(heat spreader + structural)</text>
    <line x1="525" y1="360" x2="545" y2="363" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- Layer 8: Vehicle Connector -->
  <g id="vehicle-conn" transform="translate(0,510)">
    <polygon points="310,420 350,430 390,420 350,410" fill="#d0b8e8" stroke="#7050a0" stroke-width="1.5"/>
    <polygon points="310,420 310,435 350,445 350,430" fill="#c0a8e0" stroke="#7050a0" stroke-width="1"/>
    <polygon points="350,430 350,445 390,435 390,420" fill="#b098d8" stroke="#7050a0" stroke-width="1"/>
    <!-- Pin array representation -->
    <rect x="325" y="415" width="4" height="3" fill="#ffd700"/>
    <rect x="335" y="415" width="4" height="3" fill="#ffd700"/>
    <rect x="345" y="415" width="4" height="3" fill="#ffd700"/>
    <rect x="355" y="415" width="4" height="3" fill="#ffd700"/>
    <rect x="365" y="415" width="4" height="3" fill="#ffd700"/>
    <text x="550" y="423" font-family="Arial, sans-serif" font-size="10" fill="#555">Vehicle Connector (J100)</text>
    <text x="550" y="435" font-family="Arial, sans-serif" font-size="8" fill="#888">(12V + CAN + IGN + WAKE)</text>
    <line x1="395" y1="420" x2="545" y2="423" stroke="#999" stroke-width="0.5"/>
  </g>

  <!-- Assembly direction arrows -->
  <g id="assembly-arrows">
    <polygon points="345,85 350,70 355,85" fill="#666"/>
    <polygon points="345,760 350,775 355,760" fill="#666"/>
    <text x="365" y="78" font-family="Arial, sans-serif" font-size="8" fill="#666">Assembly direction</text>
  </g>

  <!-- Legend / Notes -->
  <g id="notes" transform="translate(30,730)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">Assembly Stack (top to bottom):</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="8" fill="#555">1. Housing front shell  2. Windshield bracket  3. Forward camera window  4. DMS camera window</text>
    <text x="0" y="26" font-family="Arial, sans-serif" font-size="8" fill="#555">5. Main PCB  6. DMS flex  7. Aluminum rear thermal plate  8. Vehicle connector</text>
  </g>
</svg>
